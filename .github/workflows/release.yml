name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish ZIP
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-release-lock.txt

      - name: Run tests
        run: |
          python -m py_compile main.py main.pyw maple_gamepad_macro.py auto_potion.py
          python -m compileall -q maple_star
          python -m unittest discover -s tests
          python -m pip check

      - name: Build release package
        run: .\build_release.bat

      - name: Verify release package
        shell: pwsh
        run: |
          $zipPath = "release\MapleStar.zip"
          if (-not (Test-Path -LiteralPath $zipPath)) {
            throw "Missing release package: $zipPath"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipPath))
          try {
            $entries = @($zip.Entries | ForEach-Object { $_.FullName })
            foreach ($required in @("MapleStar.exe", "README.txt")) {
              if ($entries -notcontains $required) {
                throw "Release package is missing required file: $required"
              }
            }

            if (-not ($entries | Where-Object { $_ -like "*qwindows.dll" })) {
              throw "Release package is missing qwindows.dll"
            }
            if ($entries | Where-Object { $_ -match '(^|/)(tcl|tk|_tkinter)' }) {
              throw "Release package unexpectedly contains Tcl/Tk runtime"
            }

            foreach ($forbidden in @("settings.json", "MapleStar.spec")) {
              if ($entries -contains $forbidden) {
                throw "Release package contains forbidden file: $forbidden"
              }
            }

            foreach ($prefix in @("build/", "dist/", "release/")) {
              if ($entries | Where-Object { $_ -like "$prefix*" }) {
                throw "Release package contains forbidden directory: $prefix"
              }
            }
          } finally {
            $zip.Dispose()
          }

          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath).Hash
          "MAPLESTAR_ZIP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "### MapleStar.zip" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- SHA256: ``$hash``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zipPath = "release\MapleStar.zip"
          $notesPath = "release_notes.md"

          @"
          MapleStar packaged build.

          - Commit: $env:GITHUB_SHA
          - SHA256: $env:MAPLESTAR_ZIP_SHA256
          - Asset: MapleStar.zip
          "@ | Set-Content -LiteralPath $notesPath -Encoding utf8

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zipPath --clobber
            gh release edit $tag --title "MapleStar $tag" --notes-file $notesPath --draft=false --prerelease=false
          } else {
            gh release create $tag $zipPath --title "MapleStar $tag" --notes-file $notesPath --target $env:GITHUB_SHA
          }
